name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On publie le contenu du site SANS .git ni .github (artefact bien plus léger).
      - name: Préparer le site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      # Laisse l'artefact s'enregistrer côté GitHub : sans cette pause, deploy-pages
      # échouait parfois en « No artifacts named github-pages » juste après l'envoi
      # (21/11/2026, trois échecs d'affilée puis succès sans rien changer).
      - name: Attendre l'enregistrement de l'artefact
        run: sleep 20

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
