<!--
  IMPORTANT iOS Safari : sans format-detection, iOS interprète automatiquement
  les dates/heures/emails/téléphones comme des actions et les transforme en
  liens (tap → "Send via Mail", "Add to Calendar"...). Pour une page de
  booking où chaque créneau affiche une date/heure, ce comportement casse
  l'UX : tap sur un slot → ouvre Mail au lieu de selectSlot().
-->
<meta name="format-detection" content="telephone=no, date=no, email=no, address=no">

<!--
  reCAPTCHA v3 (App Check + createBooking/rescheduleBooking) : le script est
  injecté par book-app.js, et SEULEMENT hors mode démo (?demo=1 ne doit faire
  aucun appel réseau). Clé du site : 6LeL4OssAAAAAEPEoBCWvALa0Acy2U4hWE-nzvjv.

<style>
/*
  Pulse Booking v2. Neutres clairs/sombres, l'accent vient de l'hôte
  (accentHex du lien, posé par book-app.js dans --host-*). Pas de dégradé,
  pas de halo, pas d'effet verre (règle de la marque).
*/
:root {
  --bg: #F4F4F2;
  --surface: #FFFFFF;
  --surface-2: #F2F2F0;
  --line: #E5E5E2;
  --line-strong: #D1D1CD;
  --text: #1A1A1C;
  --text-2: #55555C;
  --text-3: #6F6F76;
  --danger: #B42318;
  --danger-soft: #FEF3F2;
  --on-danger: #FFFFFF;
  --accent: var(--host-accent, #1A1A1C);
  --on-accent: var(--host-on-accent, #FFFFFF);
  --accent-ink: var(--host-ink-l, #1A1A1C);
  --accent-soft: var(--host-soft-l, rgba(26, 26, 28, 0.07));
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F0F11;
    --surface: #19191C;
    --surface-2: #232327;
    --line: #2D2D32;
    --line-strong: #3C3C42;
    --text: #F2F2F4;
    --text-2: #B0B0B8;
    --text-3: #8C8C94;
    --danger: #FF8A7A;
    --danger-soft: rgba(255, 138, 122, 0.12);
    --on-danger: #1A0A08;
    --accent: var(--host-accent, #F2F2F4);
    --on-accent: var(--host-on-accent, #0F0F11);
    --accent-ink: var(--host-ink-d, #F2F2F4);
    --accent-soft: var(--host-soft-d, rgba(242, 242, 244, 0.10));
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
a { color: var(--accent-ink); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px max(16px, env(safe-area-inset-right)) 104px max(16px, env(safe-area-inset-left));
}

/* Cartes */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 16px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
  scroll-margin-top: 12px;
}
.card h2 { font-size: 18px; line-height: 1.3; font-weight: 650; margin: 0; }
.card h2:focus { outline: none; }
.sub { margin: 2px 0 0; color: var(--text-2); font-size: 15px; }
.muted { color: var(--text-2); }
.small { font-size: 14px; }

/* En-tête du lien */
.head { padding: 20px; }
.kicker { margin: 0 0 10px; font-size: 14px; font-weight: 650; color: var(--accent-ink); }
.host { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-width: 0; }
.avatar {
  flex: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 700; font-size: 15px;
}
.host-name { font-size: 16px; font-weight: 600; color: var(--text-2); min-width: 0; }
.title { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; color: var(--text-2); font-size: 15px; }
.meta-item { display: inline-flex; align-items: flex-start; gap: 6px; min-width: 0; }
.lead { margin: 12px 0 0; color: var(--text-2); font-size: 15px; }

.ico {
  flex: none;
  width: 18px; height: 18px;
  margin-top: 2px;
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
[dir="rtl"] .flip { transform: scaleX(-1); }

/* Durées */
.durs-label { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--text-2); }
.durs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip {
  min-height: 44px;
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-weight: 600; font-size: 15px;
  cursor: pointer;
  transition: background-color .12s, border-color .12s;
}
.chip:hover { border-color: var(--accent-ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent-ink); }

/* Calendrier */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 8px; }
.cal-month { font-weight: 650; font-size: 16px; text-align: center; flex: 1; }
.icon-btn {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid; place-items: center;
  cursor: pointer;
}
.icon-btn .ico { margin: 0; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 2px; }
.wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-3); padding: 4px 0; }
.day {
  position: relative;
  justify-self: center;
  width: 100%; max-width: 46px;
  aspect-ratio: 1;
  min-height: 38px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text-3);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  display: grid; place-items: center;
  transition: background-color .12s, color .12s;
}
.day:disabled { cursor: default; }
.day.avail { background: var(--accent-soft); color: var(--accent-ink); font-weight: 650; cursor: pointer; }
.day.avail:hover { box-shadow: inset 0 0 0 1.5px var(--accent-ink); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.day.today::after {
  content: "";
  position: absolute;
  bottom: 12%;
  left: 50%;
  width: 4px; height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: currentColor;
}
.tz { margin: 14px 0 0; font-size: 13px; color: var(--text-2); }

/* Horaires */
.times { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 14px; }
.time {
  min-height: 48px;
  padding: 6px 8px;
  border-radius: 12px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--accent-ink);
  font-weight: 650; font-size: 15px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background-color .12s, border-color .12s;
}
.time:hover { border-color: var(--accent-ink); }
.time[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent-ink); }
.empty { margin: 14px 0 0; color: var(--text-2); }

/* Récapitulatif du créneau choisi */
.when {
  display: flex; align-items: flex-start; gap: 10px;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--surface-2);
}
.when strong { display: block; font-weight: 650; }
.when span { color: var(--text-2); }

/* Formulaire */
.fields { display: grid; gap: 14px; margin-top: 18px; }
.pair { display: grid; gap: 14px; }
.field label { display: block; margin-bottom: 6px; font-size: 15px; font-weight: 600; }
.field .opt { font-weight: 400; color: var(--text-3); }
.field input, .field textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: 16px;
}
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 1px; border-color: var(--accent-ink); }
[aria-invalid="true"] { border-color: var(--danger) !important; }
.honeypot { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); opacity: 0; pointer-events: none; }
.consent { display: flex; align-items: flex-start; gap: 12px; margin-top: 18px; font-size: 14px; color: var(--text-2); cursor: pointer; }
.consent input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent-ink); cursor: pointer; }
.consent a { color: var(--text-2); text-underline-offset: 2px; }
.hint { margin: 10px 0 0; font-size: 14px; color: var(--text-2); text-align: center; }

/* Boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  min-height: 52px;
  padding: 12px 20px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 16px; font-weight: 650;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: opacity .12s, border-color .12s;
}
.btn:hover { border-color: var(--accent-ink); }
.btn .ico { margin: 0; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent-ink); }
.btn-primary:hover { opacity: .92; }
.btn-danger { background: var(--danger); color: var(--on-danger); border-color: var(--danger); }
.btn-danger:hover { opacity: .92; border-color: var(--danger); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-quiet {
  width: auto; min-height: 44px; padding: 8px 12px;
  border-color: transparent; background: transparent;
  color: var(--text-2); font-weight: 600;
  text-decoration: underline; text-underline-offset: 3px;
}
.btn-quiet:hover { border-color: transparent; color: var(--text); }
.stack { display: grid; gap: 10px; margin-top: 18px; }
.center { text-align: center; }
form .btn-primary { margin-top: 18px; }

/* Messages */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--danger);
  background: var(--danger-soft);
  font-size: 15px;
  text-align: start;
}
.notice .ico { color: var(--danger); }
.notice.info { border-color: var(--line-strong); background: var(--surface-2); }
.notice.info .ico { color: var(--text-2); }

/* Écrans de fin (confirmé, demande envoyée, annulé, erreur) */
.done { text-align: center; padding: 28px 20px; }
.badge {
  width: 56px; height: 56px;
  margin: 0 auto 14px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.badge .ico { width: 28px; height: 28px; margin: 0; stroke-width: 2.2; }
.badge.bad { background: var(--danger-soft); color: var(--danger); }
.done h2 { font-size: 22px; margin-bottom: 8px; }
.done p { margin: 8px 0 0; color: var(--text-2); }
.done .when { text-align: start; margin: 16px 0 4px; }
.done .when strong { color: var(--text); }
.em { font-weight: 600; color: var(--text); }
.note { font-size: 14px; }
.note .ico { display: inline-block; width: 16px; height: 16px; margin: 0 6px 0 0; margin-inline: 0 6px; vertical-align: -3px; }
.group { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.group-label { margin: 0 0 10px; font-size: 14px; font-weight: 650; color: var(--text); }
.group .stack { margin-top: 0; }

/* Chargement */
.loading { display: grid; justify-items: center; gap: 14px; padding: 56px 16px; color: var(--text-2); }
.spinner {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 3px solid var(--line-strong);
  border-top-color: var(--accent-ink);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Pied de page */
.foot { display: grid; justify-items: center; gap: 2px; margin-top: 28px; text-align: center; font-size: 13px; color: var(--text-2); }
.foot p { margin: 0; }
.foot a { display: inline-block; padding: 6px 4px; color: var(--text-2); text-decoration: none; }
.foot a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.foot .app { padding: 6px 0; font-weight: 600; }
.lang { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--text-3); }
.lang .ico { margin: 0; width: 16px; height: 16px; }
.lang select {
  min-height: 36px;
  max-width: 220px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-2);
  font-size: 13px;
}

/* Grand écran : calendrier et horaires côte à côte */
@media (min-width: 600px) {
  .card { padding: 24px; }
  .head { padding: 24px; }
  .title { font-size: 30px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .manage .stack { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 900px) {
  .wrap { max-width: 940px; padding-top: 40px; }
  .picker { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .picker > .card { margin-bottom: 0; }
  .picker > .full { grid-column: 1 / -1; }
  .done, .narrow { max-width: 600px; margin-left: auto; margin-right: auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
  .spinner { animation: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header id="head" class="card head" hidden></header>
  <main id="main">
    <div class="loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span></div>
  </main>
  <footer id="foot" class="foot"></footer>
</div>

<noscript>
  <p style="text-align:center;padding:0 16px">JavaScript is required to book a time slot.</p>
</noscript>

<!-- Firebase SDK (chargé à la demande) + logique de réservation -->
<script type="module" src="book-app.js"></script>

</body>
